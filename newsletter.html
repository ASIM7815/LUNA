<script>
(function(){

function overviewPage(){return '<div id="nwl-page"><div class="nwl-hero"><div class="nwl-label">ISL Engineering College</div><h1>Department Newsletters</h1><p>Academic highlights, research breakthroughs &amp; student achievements — 2025–26</p></div><div class="nwl-cards"><div class="nwl-sep">Choose Your Department</div><div class="nwl-grid"><div class="nwl-card"><div class="nwl-card-top"><div class="nwl-icon cse">CS</div><div class="nwl-dept cse">Computer Science &amp; Engineering</div><h2>CSE Department Newsletter</h2><p>Stay informed about the latest innovations, research breakthroughs, student achievements, hackathons, workshops, placements, and technical seminars throughout the academic year.</p></div><div class="nwl-divider"></div><div class="nwl-card-btm"><div class="nwl-meta"><span><i class="fa fa-calendar"></i> 2025–26</span><span><i class="fa fa-file-pdf-o"></i> Vol. 2026</span></div><a href="./newsletter.html?dept=cse" class="nwl-btn cse">View Newsletter <i class="fa fa-long-arrow-right"></i></a></div></div><div class="nwl-card"><div class="nwl-card-top"><div class="nwl-icon it">IT</div><div class="nwl-dept it">Information Technology</div><h2>IT Department Newsletter</h2><p>Discover exciting developments in Information Technology — student projects, industry collaborations, faculty research, coding competitions, and career opportunities in the rapidly evolving IT landscape.</p></div><div class="nwl-divider"></div><div class="nwl-card-btm"><div class="nwl-meta"><span><i class="fa fa-calendar"></i> 2025–26</span><span><i class="fa fa-file-pdf-o"></i> Vol. 2026</span></div><a href="./newsletter.html?dept=it" class="nwl-btn it">View Newsletter <i class="fa fa-long-arrow-right"></i></a></div></div><div class="nwl-card"><div class="nwl-card-top"><div class="nwl-icon aids">AI</div><div class="nwl-dept aids">Artificial Intelligence &amp; Data Science</div><h2>AIDS Department Newsletter</h2><p>Explore the cutting-edge world of AI &amp; Data Science — machine learning projects, AI workshops, data analytics competitions, internship opportunities, and the latest trends shaping the future of technology.</p></div><div class="nwl-divider"></div><div class="nwl-card-btm"><div class="nwl-meta"><span><i class="fa fa-calendar"></i> 2025–26</span><span><i class="fa fa-file-pdf-o"></i> Vol. 2026</span></div><a href="./newsletter.html?dept=aids" class="nwl-btn aids">View Newsletter <i class="fa fa-long-arrow-right"></i></a></div></div></div></div><div class="nwl-foot">ISL Engineering College &nbsp;&middot;&nbsp; <a href="./">Return to Home</a></div></div>';}
function detailPage(key){var d=DEPARTMENTS[key];if(!d)return overviewPage();return '<div id="nwl-page"><div class="dnl-hero" style="background:'+d.heroBg+'"><ul class="dnl-crumbs"><li><a href="./">Home</a></li><li><a href="./newsletter.html">Newsletters</a></li><li>'+d.code+' 2026</li></ul><div class="dnl-hero-badge"><i class="fa fa-newspaper-o"></i> Department Newsletter</div><h1>'+d.hero+'</h1><p class="dnl-hero-sub">Academic Year 2025–26 &nbsp;&middot;&nbsp; Vol. 2026</p></div><div class="dnl-body"><div class="dnl-inner"><div><div class="dnl-main-card"><div class="dnl-card-header" style="background:'+d.headerBg+'"><span class="dnl-year-pill" style="color:'+d.accent+'">2026</span><span class="dnl-edition-tag">Latest Edition</span></div><div class="dnl-card-body"><h2>'+d.name+' Newsletter 2026</h2><p>'+d.desc+'</p><p>This edition reflects the department\'s academic progress, student excellence, faculty contributions, innovation, and industry-oriented activities for the 2025–26 cycle.</p><div class="dnl-highlights-title" style="color:'+d.accent+'">What\'s Inside</div><ul class="dnl-highlights">'+d.highlights.map(function(item){return '<li style="background:'+d.soft+'"><i class="fa fa-check-circle" style="color:'+d.accent+'"></i>'+item+'</li>';}).join('')+'</ul><a href="'+d.pdf+'" class="dnl-cta-btn" style="background:'+d.button+';box-shadow:0 6px 20px rgba(25,47,89,.25)" onmouseover="this.style.background=\''+d.buttonHover+'\'" onmouseout="this.style.background=\''+d.button+'\'" target="_blank" rel="noopener noreferrer"><i class="fa fa-file-pdf-o"></i>View 2026 Newsletter<i class="fa fa-long-arrow-right"></i></a></div></div><a href="./newsletter.html" class="dnl-back" style="color:'+d.accent+'"><i class="fa fa-arrow-left"></i> Back to All Newsletters</a></div><div class="dnl-sidebar"><div class="dnl-info-card"><div class="dnl-info-card-head" style="background:'+d.accent+'">Newsletter Details</div><ul class="dnl-info-list"><li><span class="label">Edition</span><span
