<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="./images/unnamed.webp" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#192f59" />
    <meta name="description"
        content="ISL Engineering College is Affliliated to Osmania University & Approved by AICTE Estd: 2008. It is a Private Engineering College Located in Hyderabad India." />
    <link rel="apple-touch-icon" href="./images/logo.png" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="manifest" href="./manifest.json" />
    <title>ISL Engineering College</title>

    <script>
        (function () {
            function isHomeRoute() {
                var path = window.location.pathname.replace(/\/+$/, "") || "/";
                var hash = window.location.hash;
                return (path === "/" || path === "/index.html") && (hash === "" || hash === "#" || hash === "#/");
            }

            function syncRouteClass() {
                document.documentElement.classList.toggle("is-home-route", isHomeRoute());
                document.documentElement.classList.toggle("is-non-home-route", !isHomeRoute());
            }

            syncRouteClass();
            window.__isISLECHomeRoute = isHomeRoute;
            window.__syncISLECRouteClass = syncRouteClass;
        })();
    </script>

    <!-- CRITICAL: Hide carousels IMMEDIATELY - before any other CSS loads -->
    <style>
        /* Emergency carousel hiding - loads first to prevent flash on inner pages only */
        html.is-non-home-route .carousel:not(.main-carousel):not(.highlights-carousel) {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            overflow: hidden !important;
            position: absolute !important;
            left: -9999px !important;
        }
        
        html.is-non-home-route .carousel:not(.main-carousel):not(.highlights-carousel) * {
            display: none !important;
        }
        
        /* Allow main and highlights to show */
        .main-carousel,
        .highlights-carousel {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            height: auto !important;
            position: relative !important;
            left: auto !important;
        }
    </style>

    <style>
        .carousel {
            --bs-carousel-transition: transform 700ms cubic-bezier(.22, .61, .36, 1);
        }

        .carousel.carousel-fade {
            --bs-carousel-transition: opacity 700ms cubic-bezier(.22, .61, .36, 1);
        }

        @media (prefers-reduced-motion: reduce) {
            .carousel {
                --bs-carousel-transition: none;
            }
        }

        .js-fallback-carousel .carousel-inner {
            position: relative;
            overflow: hidden;
        }

        .js-fallback-carousel .carousel-item {
            display: block !important;
            position: absolute;
            inset: 0;
            float: none;
            width: 100%;
            margin-right: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 700ms cubic-bezier(.22, .61, .36, 1),
                transform 700ms cubic-bezier(.22, .61, .36, 1);
            transform: scale(0.995);
            backface-visibility: hidden;
        }

        .js-fallback-carousel .carousel-item.active {
            position: relative;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1);
            z-index: 1;
        }

        .js-fallback-carousel .carousel-indicators li {
            cursor: pointer;
        }

        .main-carousel .carousel-control-prev,
        .main-carousel .carousel-control-next,
        .highlights-carousel .carousel-control-prev,
        .highlights-carousel .carousel-control-next {
            display: flex !important;
            align-items: center;
            justify-content: center;
            top: 50%;
            bottom: auto;
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: rgba(8, 22, 48, 0.78);
            box-shadow: 0 10px 26px rgba(8, 22, 48, 0.28);
            opacity: 0.92;
            outline: 2px solid rgba(255, 255, 255, 0.42);
            outline-offset: -4px;
            transform: translateY(-50%);
            transition: background 160ms ease, box-shadow 160ms ease, opacity 160ms ease, transform 160ms ease;
            z-index: 4;
        }

        .main-carousel .carousel-control-prev,
        .highlights-carousel .carousel-control-prev {
            left: 18px;
        }

        .main-carousel .carousel-control-next,
        .highlights-carousel .carousel-control-next {
            right: 18px;
        }

        .main-carousel .carousel-control-prev-icon,
        .main-carousel .carousel-control-next-icon,
        .highlights-carousel .carousel-control-prev-icon,
        .highlights-carousel .carousel-control-next-icon {
            display: block !important;
            position: relative;
            width: 20px;
            height: 20px;
            background-image: none !important;
            background-size: 0 !important;
        }

        .main-carousel .carousel-control-prev-icon::before,
        .main-carousel .carousel-control-next-icon::before,
        .highlights-carousel .carousel-control-prev-icon::before,
        .highlights-carousel .carousel-control-next-icon::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            border-top: 4px solid #ffffff;
            border-radius: 1px;
        }

        .main-carousel .carousel-control-prev-icon::before,
        .highlights-carousel .carousel-control-prev-icon::before {
            border-left: 4px solid #ffffff;
            transform: translate(-35%, -50%) rotate(-45deg);
        }

        .main-carousel .carousel-control-next-icon::before,
        .highlights-carousel .carousel-control-next-icon::before {
            border-right: 4px solid #ffffff;
            transform: translate(-65%, -50%) rotate(45deg);
        }

        .main-carousel .carousel-control-prev:hover,
        .main-carousel .carousel-control-next:hover,
        .main-carousel .carousel-control-prev:focus,
        .main-carousel .carousel-control-next:focus,
        .highlights-carousel .carousel-control-prev:hover,
        .highlights-carousel .carousel-control-next:hover,
        .highlights-carousel .carousel-control-prev:focus,
        .highlights-carousel .carousel-control-next:focus {
            background: rgba(20, 176, 104, 0.92);
            box-shadow: 0 14px 30px rgba(8, 22, 48, 0.34);
            opacity: 1;
            transform: translateY(-50%) scale(1.06);
        }

        .main-carousel .carousel-control-prev:active,
        .main-carousel .carousel-control-next:active,
        .highlights-carousel .carousel-control-prev:active,
        .highlights-carousel .carousel-control-next:active {
            transform: translateY(-50%) scale(0.98);
        }

        .main-carousel .carousel-item {
            background: linear-gradient(135deg, #062a6a 0%, #0b3b91 45%, #082a66 100%);
        }

        .main-carousel .carousel-item img {
            width: 100%;
            height: clamp(300px, 65vh, 640px);
            object-fit: contain;
            object-position: center;
            background: transparent;
        }

        .highlights-carousel .carousel-inner {
            border-radius: 8px;
            background: #edf1f7;
        }

        .highlights-carousel .carousel-item img {
            width: 100%;
            height: clamp(240px, 28vw, 350px);
            object-fit: cover;
            object-position: center;
            background: #edf1f7;
        }

        .homepage-news-visual {
            display: block;
            margin: 14px 0 18px;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid rgba(25, 47, 89, 0.12);
            background: #ffffff;
            box-shadow: 0 10px 24px rgba(25, 47, 89, 0.08);
        }

        .homepage-news-visual img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            object-position: center;
        }

        .homepage-useful-links {
            display: grid;
            gap: 10px;
            margin: 14px 0 18px;
        }

        .homepage-useful-links a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 52px;
            padding: 12px 14px;
            border: 1px solid rgba(25, 47, 89, 0.14);
            border-radius: 8px;
            background: #ffffff;
            color: #192f59;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.25;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(25, 47, 89, 0.06);
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        .homepage-useful-links a:hover,
        .homepage-useful-links a:focus {
            border-color: rgba(25, 47, 89, 0.32);
            color: #10274f;
            text-decoration: none;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(25, 47, 89, 0.11);
        }

        .homepage-useful-links i {
            flex: 0 0 auto;
            color: #c99a2e;
        }

        @media (max-width: 576px) {
            .main-carousel .carousel-control-prev,
            .main-carousel .carousel-control-next,
            .highlights-carousel .carousel-control-prev,
            .highlights-carousel .carousel-control-next {
                width: 42px;
                height: 42px;
            }

            .main-carousel .carousel-control-prev,
            .highlights-carousel .carousel-control-prev {
                left: 10px;
            }

            .main-carousel .carousel-control-next,
            .highlights-carousel .carousel-control-next {
                right: 10px;
            }

            .main-carousel .carousel-item img {
                height: clamp(220px, 45vh, 420px);
            }

            .highlights-carousel .carousel-item img {
                height: 240px;
            }

        }
    </style>

    <script>
        (function () {
            var HERO_SLIDES = [
                { id: "hero-hacking", src: "https://the.islec.edu.in/BANNERS/banner.png", alt: "Hackathon Event" },
                { id: "hero-shafisir", src: "./SHAFISIR.jpeg", alt: "Faculty Highlights" },
                { id: "hero-hack23", src: "https://the.islec.edu.in/BANNERS/screen.jpeg", alt: "Hackathon Highlights" },
                { id: "hero-illuminate", src: "https://the.islec.edu.in/BANNERS/illuminate.png", alt: "Campus Highlights" },
                { id: "hero-topper25", src: "./allimages/mainSlider/topper25.jpg", alt: "Topper Highlights" }
            ];

            var HIGHLIGHT_SLIDES = [
                { id: "highlight-event-15112025", src: "./allimages/mainSlider/15112025.jpg", alt: "Campus Event Highlights" },
                { id: "highlight-recognition", src: "./allimages/mainSlider/Recognition25.jpg", alt: "Recognition 2025" },
                { id: "highlight-orientation", src: "./allimages/mainSlider/orientation24.jpeg", alt: "Orientation Highlights" },
                { id: "highlight-judo", src: "./allimages/mainSlider/judo2024.jpg", alt: "Sports Highlights" },
                { id: "highlight-antidrug", src: "./allimages/mainSlider/antidrug2024.jpg", alt: "Campus Highlights" }
            ];

            var activeCarousels = [];
            var globalObserver = null;

            function toArray(list) {
                return Array.prototype.slice.call(list || []);
            }

            function warmImage(src) {
                if (!src) return;
                var img = new Image();
                try { img.decoding = "async"; } catch (e) { }
                img.src = src;
            }

            function createSlide(slide, isActive) {
                var item = document.createElement("div");
                item.className = "carousel-item" + (isActive ? " active" : "");
                item.setAttribute("data-local-slide", slide.id);

                var img = document.createElement("img");
                img.src = slide.src;
                img.className = "img-fluid d-block w-100";
                img.alt = slide.alt || "Slide";
                try { img.loading = isActive ? "eager" : "lazy"; } catch (e) { }
                try { img.decoding = "async"; } catch (e) { }

                item.appendChild(img);
                return item;
            }

            function rebuildIndicators(carousel, count) {
                var indicators = carousel.querySelector(".carousel-indicators");
                if (!indicators) {
                    indicators = document.createElement("ol");
                    indicators.className = "carousel-indicators";
                    carousel.insertBefore(indicators, carousel.firstChild);
                }

                indicators.innerHTML = "";
                for (var i = 0; i < count; i++) {
                    var indicator = document.createElement("li");
                    indicator.setAttribute("data-slide-to", String(i));
                    indicator.setAttribute("tabindex", "0");
                    indicator.setAttribute("role", "button");
                    indicator.setAttribute("aria-label", "Slide " + (i + 1));
                    if (i === 0) {
                        indicator.className = "active";
                        indicator.setAttribute("aria-current", "true");
                    }
                    indicators.appendChild(indicator);
                }

                return indicators;
            }

            function setControlsVisible(carousel, isVisible) {
                var displayValue = isVisible ? "" : "none";
                var controls = carousel.querySelectorAll(".carousel-control-prev, .carousel-control-next, .carousel-indicators");
                for (var i = 0; i < controls.length; i++) {
                    controls[i].style.display = displayValue;
                }
            }

            function createControl(direction) {
                var control = document.createElement("button");
                control.type = "button";
                control.className = "carousel-control-" + direction;
                control.setAttribute("aria-label", direction === "prev" ? "Previous slide" : "Next slide");

                var icon = document.createElement("span");
                icon.className = "carousel-control-" + direction + "-icon";
                icon.setAttribute("aria-hidden", "true");

                var label = document.createElement("span");
                label.className = "sr-only";
                label.textContent = direction === "prev" ? "Previous" : "Next";

                control.appendChild(icon);
                control.appendChild(label);
                return control;
            }

            function ensureControls(carousel) {
                if (!carousel.querySelector(".carousel-control-prev")) {
                    carousel.appendChild(createControl("prev"));
                }

                if (!carousel.querySelector(".carousel-control-next")) {
                    carousel.appendChild(createControl("next"));
                }

                var prev = carousel.querySelector(".carousel-control-prev");
                var next = carousel.querySelector(".carousel-control-next");
                if (prev) prev.replaceWith(prev.cloneNode(true));
                if (next) next.replaceWith(next.cloneNode(true));
            }

            function cleanupCarousel(carousel) {
                if (!carousel) return;
                var timer = carousel._carouselTimer;
                if (timer) {
                    window.clearInterval(timer);
                    carousel._carouselTimer = null;
                }
                carousel.removeAttribute("data-local-carousel-ready");
            }

            function enhanceCarousel(carousel, slides, extraClasses, intervalMs) {
                if (!carousel) return false;
                
                var inner = carousel.querySelector(".carousel-inner");
                if (!inner || !slides || !slides.length) return false;

                // Check if carousel needs reinitialization
                var isReady = carousel.getAttribute("data-local-carousel-ready") === "true";
                var hasSlides = inner.querySelectorAll(".carousel-item").length > 0;
                
                if (isReady && hasSlides) {
                    setControlsVisible(carousel, inner.querySelectorAll(".carousel-item").length > 1);
                    return true;
                }

                // Cleanup old carousel if exists
                cleanupCarousel(carousel);

                carousel.setAttribute("data-local-carousel-ready", "true");
                carousel.classList.add("js-fallback-carousel");

                for (var classIndex = 0; classIndex < extraClasses.length; classIndex++) {
                    carousel.classList.add(extraClasses[classIndex]);
                }

                inner.innerHTML = "";
                for (var i = 0; i < slides.length; i++) {
                    inner.appendChild(createSlide(slides[i], i === 0));
                }

                var indicators = rebuildIndicators(carousel, slides.length);
                ensureControls(carousel);
                var items = toArray(inner.querySelectorAll(".carousel-item"));
                var indicatorItems = toArray(indicators.children);
                var currentIndex = 0;
                var cycleTimer = null;

                function applySlide(index) {
                    if (!items.length) return;
                    currentIndex = (index + items.length) % items.length;

                    for (var itemIndex = 0; itemIndex < items.length; itemIndex++) {
                        var isActive = itemIndex === currentIndex;
                        items[itemIndex].classList.toggle("active", isActive);
                    }

                    for (var indicatorIndex = 0; indicatorIndex < indicatorItems.length; indicatorIndex++) {
                        var indicatorActive = indicatorIndex === currentIndex;
                        indicatorItems[indicatorIndex].classList.toggle("active", indicatorActive);
                        if (indicatorActive) {
                            indicatorItems[indicatorIndex].setAttribute("aria-current", "true");
                        } else {
                            indicatorItems[indicatorIndex].removeAttribute("aria-current");
                        }
                    }

                    warmImage(slides[currentIndex].src);
                    warmImage(slides[(currentIndex + 1) % slides.length].src);
                }

                function startCycle() {
                    if (cycleTimer || items.length < 2) return;
                    cycleTimer = window.setInterval(function () {
                        applySlide(currentIndex + 1);
                    }, intervalMs);
                    carousel._carouselTimer = cycleTimer;
                }

                function stopCycle() {
                    if (!cycleTimer) return;
                    window.clearInterval(cycleTimer);
                    cycleTimer = null;
                    carousel._carouselTimer = null;
                }

                function restartCycle() {
                    stopCycle();
                    startCycle();
                }

                var prevControl = carousel.querySelector(".carousel-control-prev");
                if (prevControl) {
                    prevControl.addEventListener("click", function (event) {
                        event.preventDefault();
                        applySlide(currentIndex - 1);
                        restartCycle();
                    });
                }

                var nextControl = carousel.querySelector(".carousel-control-next");
                if (nextControl) {
                    nextControl.addEventListener("click", function (event) {
                        event.preventDefault();
                        applySlide(currentIndex + 1);
                        restartCycle();
                    });
                }

                for (var indicatorItemIndex = 0; indicatorItemIndex < indicatorItems.length; indicatorItemIndex++) {
                    (function (targetIndex) {
                        var indicator = indicatorItems[targetIndex];
                        indicator.addEventListener("click", function (event) {
                            event.preventDefault();
                            applySlide(targetIndex);
                            restartCycle();
                        });
                        indicator.addEventListener("keydown", function (event) {
                            if (event.key !== "Enter" && event.key !== " ") return;
                            event.preventDefault();
                            applySlide(targetIndex);
                            restartCycle();
                        });
                    })(indicatorItemIndex);
                }

                carousel.addEventListener("mouseenter", stopCycle);
                carousel.addEventListener("mouseleave", startCycle);
                carousel.addEventListener("focusin", stopCycle);
                carousel.addEventListener("focusout", startCycle);

                applySlide(0);
                setControlsVisible(carousel, items.length > 1);
                startCycle();

                activeCarousels.push(carousel);
                return true;
            }

            function findMainCarousel() {
                var carousels = toArray(document.querySelectorAll(".carousel"));
                var firstCarousel = null;

                for (var i = 0; i < carousels.length; i++) {
                    var carousel = carousels[i];
                    if (!carousel.querySelector(".carousel-inner")) continue;
                    if (!firstCarousel) firstCarousel = carousel;
                    if (!carousel.closest(".pt-25.col-md-4")) return carousel;
                }

                return firstCarousel;
            }

            function findHighlightsCarousel() {
                var headings = toArray(document.querySelectorAll("h1, h2, h3, h4, h5, h6"));
                for (var i = 0; i < headings.length; i++) {
                    var headingText = (headings[i].textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
                    if (headingText !== "highlights") continue;
                    var section = headings[i].closest("section");
                    if (!section) continue;
                    var carousel = section.querySelector(".carousel");
                    if (carousel) return carousel;
                }
                return null;
            }

            function tryInit() {
                // CRITICAL: Only initialize carousels on homepage
                if (typeof window.__syncISLECRouteClass === "function") {
                    window.__syncISLECRouteClass();
                }

                var isHomePage = typeof window.__isISLECHomeRoute === "function"
                    ? window.__isISLECHomeRoute()
                    : (window.location.hash === '' || window.location.hash === '#' || window.location.hash === '#/');
                
                if (!isHomePage) {
                    // Not on homepage - don't initialize carousels
                    return false;
                }
                
                var mainReady = enhanceCarousel(findMainCarousel(), HERO_SLIDES, ["main-carousel", "carousel-fade"], 4500);
                var highlightsReady = enhanceCarousel(findHighlightsCarousel(), HIGHLIGHT_SLIDES, ["highlights-carousel"], 5000);
                return mainReady && highlightsReady;
            }

            function startObserver() {
                if (globalObserver) {
                    globalObserver.disconnect();
                }

                globalObserver = new MutationObserver(function () {
                    tryInit();
                });

                globalObserver.observe(document.documentElement, { childList: true, subtree: true });
            }

            // Listen for route changes (popstate for back/forward, and monitor hash/path changes)
            window.addEventListener('popstate', function() {
                setTimeout(function() {
                    activeCarousels.forEach(cleanupCarousel);
                    activeCarousels = [];
                    tryInit();
                }, 100);
            });

            window.addEventListener('hashchange', function() {
                if (typeof window.__syncISLECRouteClass === "function") {
                    window.__syncISLECRouteClass();
                }
                setTimeout(function() {
                    activeCarousels.forEach(cleanupCarousel);
                    activeCarousels = [];
                    tryInit();
                }, 100);
            });

            document.addEventListener("click", function(event) {
                var logoLink = event.target && event.target.closest ? event.target.closest(".navbar-brand") : null;
                if (!logoLink) return;
                setTimeout(function() {
                    if (typeof window.__syncISLECRouteClass === "function") {
                        window.__syncISLECRouteClass();
                    }
                    tryInit();
                }, 150);
            }, true);

            // Monitor URL changes for React Router
            var lastRoute = window.location.pathname + window.location.hash;
            setInterval(function() {
                var currentRoute = window.location.pathname + window.location.hash;
                if (currentRoute !== lastRoute) {
                    lastRoute = currentRoute;
                    if (typeof window.__syncISLECRouteClass === "function") {
                        window.__syncISLECRouteClass();
                    }
                    activeCarousels.forEach(cleanupCarousel);
                    activeCarousels = [];
                    setTimeout(tryInit, 100);
                }
            }, 500);

            // Initial setup
            tryInit();
            startObserver();

            // Preload all images
            HERO_SLIDES.concat(HIGHLIGHT_SLIDES).forEach(function(slide) {
                warmImage(slide.src);
            });
        })();
    </script>

    <script>
        (function () {
            var NEWS_IMAGE_URL = "https://the.islec.edu.in/news/news.jpg";
            var USEFUL_LINKS = [
                { title: "Osmania University", href: "https://www.osmania.ac.in/" },
                { title: "ISL Pharmacy", href: "https://www.islpharmacy.in/" }
            ];
            var observer = null;

            function isHomePage() {
                return typeof window.__isISLECHomeRoute === "function"
                    ? window.__isISLECHomeRoute()
                    : (window.location.hash === "" || window.location.hash === "#" || window.location.hash === "#/");
            }

            function toArray(list) {
                return Array.prototype.slice.call(list || []);
            }

            function findSectionByHeading(label) {
                var target = label.toLowerCase();
                var headings = toArray(document.querySelectorAll("h1, h2, h3, h4, h5, h6"));
                for (var i = 0; i < headings.length; i++) {
                    var text = (headings[i].textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
                    if (text !== target) continue;
                    return headings[i].closest("section");
                }
                return null;
            }

            function enhanceNewsSection() {
                var section = findSectionByHeading("News & Updates");
                if (!section || section.querySelector(".homepage-news-visual")) return false;

                var visual = document.createElement("a");
                visual.className = "homepage-news-visual";
                visual.href = NEWS_IMAGE_URL;
                visual.target = "_blank";
                visual.rel = "noopener noreferrer";

                var image = document.createElement("img");
                image.src = NEWS_IMAGE_URL;
                image.alt = "News and updates";
                try { image.loading = "lazy"; } catch (e) { }
                try { image.decoding = "async"; } catch (e) { }

                visual.appendChild(image);
                var heading = section.querySelector(".site-heading");
                section.insertBefore(visual, heading ? heading.nextSibling : section.firstChild);
                return true;
            }

            function enhanceUsefulLinksSection() {
                var section = findSectionByHeading("Useful Links");
                if (!section || section.querySelector(".homepage-useful-links")) return false;

                var list = document.createElement("div");
                list.className = "homepage-useful-links";

                for (var i = 0; i < USEFUL_LINKS.length; i++) {
                    var item = USEFUL_LINKS[i];
                    var link = document.createElement("a");
                    link.href = item.href;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = item.title;

                    var icon = document.createElement("i");
                    icon.className = "fa fa-external-link";
                    icon.setAttribute("aria-hidden", "true");
                    link.appendChild(icon);

                    list.appendChild(link);
                }

                var heading = section.querySelector(".site-heading");
                section.insertBefore(list, heading ? heading.nextSibling : section.firstChild);
                return true;
            }

            function applyEnhancements() {
                if (!isHomePage()) return false;
                var newsReady = enhanceNewsSection();
                var usefulReady = enhanceUsefulLinksSection();
                return newsReady || usefulReady;
            }

            function startObserver() {
                if (observer) observer.disconnect();
                observer = new MutationObserver(function () {
                    applyEnhancements();
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
            }

            window.addEventListener("hashchange", function () {
                window.setTimeout(applyEnhancements, 100);
            });

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", function () {
                    applyEnhancements();
                    startObserver();
                });
            } else {
                applyEnhancements();
                startObserver();
            }
        })();

                return typeof url === "string" && fallbackMap[url] ? fallbackMap[url] : url;
            }

            if (window.fetch) {
                var originalFetch = window.fetch;
                window.fetch = function (input, init) {
                    var url = typeof input === "string" ? input : input && input.url;
                    var fallbackUrl = getFallbackUrl(url);
                    if (fallbackUrl !== url && typeof input === "string") {
                        input = fallbackUrl;
                    }
                    return originalFetch.call(this, input, init);
                };
            }

            if (window.XMLHttpRequest && window.XMLHttpRequest.prototype) {
                var originalOpen = window.XMLHttpRequest.prototype.open;
                window.XMLHttpRequest.prototype.open = function () {
                    var args = Array.prototype.slice.call(arguments);
