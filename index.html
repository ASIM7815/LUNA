        .js-fallback-carousel .carousel-inner {
            position: relative;
            overflow: hidden;
        }

            display: block !important;
            position: absolute;
            inset: 0;
            float: none;

            opacity: 0;

            transform: scale(0.995);

        }

            opacity: 1;
            visibility: visible;
            pointer-events: auto;

    <script>
        (function () {
            var HERO_SLIDES = [
                { id: "hero-hacking", src: "./hacking.png", alt: "Hackathon Event" },
                { id: "hero-shafisir", src: "./SHAFISIR.jpeg", alt: "Faculty Highlights" },
                { id: "hero-hack23", src: "./allimages/mainSlider/hack23.jpg", alt: "Hackathon Highlights" },
                { id: "hero-topper25", src: "./allimages/mainSlider/topper25.jpg", alt: "Topper Highlights" }
            ];

            var HIGHLIGHT_SLIDES = [
                { id: "highlight-recognition", src: "./allimages/mainSlider/Recognition25.jpg", alt: "Recognition 2025" },
                { id: "highlight-orientation", src: "./allimages/mainSlider/orientation24.jpeg", alt: "Orientation Highlights" },
                { id: "highlight-judo", src: "./allimages/mainSlider/judo2024.jpg", alt: "Sports Highlights" },
                { id: "highlight-antidrug", src: "./allimages/mainSlider/antidrug2024.jpg", alt: "Campus Highlights" }
            ];

            function toArray(list) {
                return Array.prototype.slice.call(list || []);
            }

            function warmImage(src) {
                if (!src) return;
                var img = new Image();
                try { img.decoding = "async"; } catch (e) { }
                img.src = src;
            }

            function createSlide(slide, isActive) {
                var item = document.createElement("div");
                item.className = "carousel-item" + (isActive ? " active" : "");
                item.setAttribute("data-local-slide", slide.id);

                var img = document.createElement("img");
                img.src = slide.src;
                img.className = "img-fluid d-block w-100";
                img.alt = slide.alt || "Slide";
                try { img.loading = isActive ? "eager" : "lazy"; } catch (e) { }
                try { img.decoding = "async"; } catch (e) { }

                item.appendChild(img);
                return item;
            }

            function rebuildIndicators(carousel, count) {
                var indicators = carousel.querySelector(".carousel-indicators");
                if (!indicators) {
                    indicators = document.createElement("ol");
                    indicators.className = "carousel-indicators";
                    carousel.insertBefore(indicators, carousel.firstChild);
                }

                indicators.innerHTML = "";
                for (var i = 0; i < count; i++) {
                    var indicator = document.createElement("li");
                    indicator.setAttribute("data-slide-to", String(i));
                    indicator.setAttribute("tabindex", "0");
                    indicator.setAttribute("role", "button");
                    indicator.setAttribute("aria-label", "Slide " + (i + 1));
                    if (i === 0) {
                        indicator.className = "active";
                        indicator.setAttribute("aria-current", "true");
                    }
                    indicators.appendChild(indicator);
                }

                return indicators;
            }

            function setControlsVisible(carousel, isVisible) {
                var displayValue = isVisible ? "" : "none";
                var controls = carousel.querySelectorAll(".carousel-control-prev, .carousel-control-next, .carousel-indicators");
                for (var i = 0; i < controls.length; i++) {
                    controls[i].style.display = displayValue;
                }
            }

            function enhanceCarousel(carousel, slides, extraClasses, intervalMs) {
                if (!carousel) return false;
                if (carousel.getAttribute("data-local-carousel-ready") === "true") return true;

                var inner = carousel.querySelector(".carousel-inner");
                if (!inner || !slides || !slides.length) return false;

                carousel.setAttribute("data-local-carousel-ready", "true");
                carousel.classList.add("js-fallback-carousel");

                for (var classIndex = 0; classIndex < extraClasses.length; classIndex++) {
                    carousel.classList.add(extraClasses[classIndex]);
                }

                inner.innerHTML = "";
                for (var i = 0; i < slides.length; i++) {
                    inner.appendChild(createSlide(slides[i], i === 0));
                }

                var indicators = rebuildIndicators(carousel, slides.length);
                var items = toArray(inner.querySelectorAll(".carousel-item"));
                var indicatorItems = toArray(indicators.children);
                var currentIndex = 0;
                var cycleTimer = null;

                function applySlide(index) {
                    if (!items.length) return;
                    currentIndex = (index + items.length) % items.length;

                    for (var itemIndex = 0; itemIndex < items.length; itemIndex++) {
                        var isActive = itemIndex === currentIndex;
                        items[itemIndex].classList.toggle("active", isActive);
                    }

                    for (var indicatorIndex = 0; indicatorIndex < indicatorItems.length; indicatorIndex++) {
                        var indicatorActive = indicatorIndex === currentIndex;
                        indicatorItems[indicatorIndex].classList.toggle("active", indicatorActive);
                        if (indicatorActive) {
                            indicatorItems[indicatorIndex].setAttribute("aria-current", "true");
                        } else {
                            indicatorItems[indicatorIndex].removeAttribute("aria-current");
                        }
                    }

                    warmImage(slides[currentIndex].src);
                    warmImage(slides[(currentIndex + 1) % slides.length].src);
                }

                function startCycle() {
                    if (cycleTimer || items.length < 2) return;
                    cycleTimer = window.setInterval(function () {
                        applySlide(currentIndex + 1);
                    }, intervalMs);
                }

                function stopCycle() {
                    if (!cycleTimer) return;
                    window.clearInterval(cycleTimer);
                    cycleTimer = null;
                }

                function restartCycle() {
                    stopCycle();
                    startCycle();
                }

                var prevControl = carousel.querySelector(".carousel-control-prev");
                if (prevControl) {
                    prevControl.addEventListener("click", function (event) {
                        event.preventDefault();
                        applySlide(currentIndex - 1);
                        restartCycle();
                    });
                }

                var nextControl = carousel.querySelector(".carousel-control-next");
                if (nextControl) {
                    nextControl.addEventListener("click", function (event) {
                        event.preventDefault();
                        applySlide(currentIndex + 1);
                        restartCycle();
                    });
                }

                for (var indicatorItemIndex = 0; indicatorItemIndex < indicatorItems.length; indicatorItemIndex++) {
                    (function (targetIndex) {
                        var indicator = indicatorItems[targetIndex];
                        indicator.addEventListener("click", function (event) {
                            event.preventDefault();
                            applySlide(targetIndex);
                            restartCycle();
                        });
                        indicator.addEventListener("keydown", function (event) {
                            if (event.key !== "Enter" && event.key !== " ") return;
                            event.preventDefault();
                            applySlide(targetIndex);
                            restartCycle();
                        });
                    })(indicatorItemIndex);
                }

                carousel.addEventListener("mouseenter", stopCycle);
                carousel.addEventListener("mouseleave", startCycle);
                carousel.addEventListener("focusin", stopCycle);
                carousel.addEventListener("focusout", startCycle);

                applySlide(0);
                setControlsVisible(carousel, items.length > 1);
                startCycle();

                return true;
            }

            function findMainCarousel() {
                var carousels = toArray(document.querySelectorAll(".carousel"));
                var firstCarousel = null;

                for (var i = 0; i < carousels.length; i++) {
                    var carousel = carousels[i];
                    if (!carousel.querySelector(".carousel-inner")) continue;
                    if (!firstCarousel) firstCarousel = carousel;
                    if (!carousel.closest(".pt-25.col-md-4")) return carousel;
                }

                return firstCarousel;
            }

            function findHighlightsCarousel() {
                var headings = toArray(document.querySelectorAll("h1, h2, h3, h4, h5, h6"));
                for (var i = 0; i < headings.length; i++) {
                    var headingText = (headings[i].textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
                    if (headingText !== "highlights") continue;
                    var section = headings[i].closest("section");
                    if (!section) continue;
                    var carousel = section.querySelector(".carousel");
                    if (carousel) return carousel;
                }
                return null;
            }

            function tryInit() {
                var mainReady = enhanceCarousel(findMainCarousel(), HERO_SLIDES, ["main-carousel", "carousel-fade"], 4500);
                var highlightsReady = enhanceCarousel(findHighlightsCarousel(), HIGHLIGHT_SLIDES, ["highlights-carousel"], 5000);
                return mainReady && highlightsReady;
            }

            if (!tryInit()) {
                var observer = new MutationObserver(function () {
                    if (tryInit()) observer.disconnect();
                });

                observer.observe(document.documentElement, { childList: true, subtree: true });
                window.setTimeout(function () {
                    observer.disconnect();
                }, 15000);
            }
        })();
    </script>

    <script>
        (function () {
            var fallbackMap = {
                "https://islec.herokuapp.com/api/blogs/all": "./DATA/events/all.json",
                "https://islec.herokuapp.com/api/blogs/sw": "./DATA/events/seminars.json",
                "https://islec.herokuapp.com/api/blogs/ie": "./DATA/events/inbounds.json",
                "https://islec.herokuapp.com/api/blogs/oi": "./DATA/events/outbounds.json",
                "https://islec.herokuapp.com/api/blogs/sp": "./DATA/events/sports.json",
                "https://sore-plum-shrug.cyclic.app/api/sidebars/events": "./DATA/events/quicklinks.json"
            };

            function getFallbackUrl(url) {
                return typeof url === "string" && fallbackMap[url] ? fallbackMap[url] : url;
            }

            if (window.fetch) {
                var originalFetch = window.fetch;
                window.fetch = function (input, init) {
                    var url = typeof input === "string" ? input : input && input.url;
                    var fallbackUrl = getFallbackUrl(url);
                    if (fallbackUrl !== url && typeof input === "string") {
                        input = fallbackUrl;
                    }
                    return originalFetch.call(this, input, init);
                };
            }

            if (window.XMLHttpRequest && window.XMLHttpRequest.prototype) {
                var originalOpen = window.XMLHttpRequest.prototype.open;
                window.XMLHttpRequest.prototype.open = function () {
                    var args = Array.prototype.slice.call(arguments);
                    args[1] = getFallbackUrl(args[1]);
                    return originalOpen.apply(this, args);
                };
            }
        })();
    </script>

            submitBtn.style.cssText = 'width:100%;padding:14px;background:linear-gradient(135deg,#192f59,#2d5aa0);color:white;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;';
            form.appendChild(submitBtn);
            
            // Course change handler
            courseSelect.onchange = function() {
                beSpecDiv.style.display = 'none';
                interDiv.style.display = 'none';
                gradDiv.style.display = 'none';
                beSpecSelect.removeAttribute('required');
                interPercent.removeAttribute('required');
                gradPercent.removeAttribute('required');
                beSpecSelect.value = '';
                interPercent.value = '';
                gradPercent.value = '';

                if (this.value === 'B.E') {
                    beSpecDiv.style.display = 'block';
                    beSpecSelect.required = true;
                    interDiv.style.display = 'block';
                    interPercent.required = true;
                } else if (this.value === 'PHARMACY') {
                    interDiv.style.display = 'block';
                    interPercent.required = true;
                } else if (this.value === 'MBA') {
                    gradDiv.style.display = 'block';
                    gradPercent.required = true;
                } else if (this.value === 'M.TECH') {
                    gradDiv.style.display = 'block';
                    gradPercent.required = true;
                }
            };
            
            // Exam change handler
            examSelect.onchange = function() {
                if (this.value) {
                    rankDiv.style.display = 'block';
                    rankInput.required = true;
                } else {
                    rankDiv.style.display = 'none';
                    rankInput.removeAttribute('required');
                    rankInput.value = '';
                }
            };
            
            // Form submit handler
            form.onsubmit = function(e) {
                e.preventDefault();
                var fd = new FormData(form);
                var course = fd.get('course');
                var courseInfo = course;
                if (course === 'B.E') courseInfo = 'B.E - ' + fd.get('beSpec');

                var msg = '*New Admission Inquiry - ISL Engineering College*\n\n';
                msg += '*Name:* ' + fd.get('fullName') + '\n';
                msg += '*Mobile:* ' + fd.get('mobile') + '\n';
                msg += '*Course:* ' + courseInfo + '\n';
                
                if (course === 'B.E' || course === 'PHARMACY') {
                    msg += '*Intermediate Percentage:* ' + fd.get('interPercent') + '\n';
                } else if (course === 'MBA' || course === 'M.TECH') {
                    msg += '*Graduation Percentage:* ' + fd.get('gradPercent') + '\n';
                }
                
                msg += '*City:* ' + fd.get('city') + '\n';
                msg += '*Entrance Exam:* ' + fd.get('entranceExam') + '\n';
                msg += '*Rank:* ' + fd.get('rank') + '\n';
                msg += '\n_Submitted via Website_';

                formContainer.innerHTML = '<div style="padding:60px 40px;text-align:center;"><div style="width:80px;height:80px;background:#4CAF50;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></div><h2 style="color:#192f59;margin:0 0 12px;font-size:24px;">Thank You!</h2><p style="color:#666;margin:0 0 8px;">Your application has been submitted.</p><p style="color:#666;margin:0;font-size:14px;">Redirecting to WhatsApp...</p></div>';
                
                localStorage.setItem(FORM_KEY, 'true');
                
                setTimeout(function() {
                    window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
                    document.body.removeChild(overlay);
                }, 1500);
            };
            
            formContainer.appendChild(form);
            modal.appendChild(header);
            modal.appendChild(formContainer);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            // Debug after adding to DOM
            console.log('Admission form loaded successfully');
            console.log('Course select element:', document.getElementById('courseSelect'));
            console.log('Course select options:', document.getElementById('courseSelect').options.length);
        }, 2000);
    })();
    </script>
</body>

</html>
